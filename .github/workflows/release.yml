name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-deb:
    name: Build .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build .deb
        run: bash deploy/build-deb.sh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/forja_*.deb
          generate_release_notes: true
