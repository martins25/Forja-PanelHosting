name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  agent:
    name: Agent (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Vet
        working-directory: agent
        run: go vet ./...
      - name: Test
        working-directory: agent
        run: go test ./... -race -count=1
      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd agent && govulncheck ./...

  api:
    name: API (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: panel/pnpm-lock.yaml
      - name: Install
        working-directory: panel
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: panel/api
        run: pnpm typecheck
      - name: Lint
        working-directory: panel/api
        run: pnpm lint
      - name: Test
        working-directory: panel/api
        run: pnpm test
      - name: Audit
        working-directory: panel
        run: pnpm audit --audit-level=moderate

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: panel/pnpm-lock.yaml
      - name: Install
        working-directory: panel
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: panel/web
        run: pnpm typecheck
      - name: Lint
        working-directory: panel/web
        run: pnpm lint
      - name: Test
        working-directory: panel/web
        run: pnpm test
