# Rootless containers must not reach the host loopback (panel API, Caddy admin API).
# The only host address they get is forja0 (10.255.0.1), served by Caddy's ingress server.
#
# The backend is pinned because the isolation options differ per backend: with pasta
# (Podman 5 default) `allow_host_loopback` does not exist. install.sh installs slirp4netns.
# Verify after creating the first account with deploy/check-isolation.sh.
[network]
default_rootless_network_cmd = "slirp4netns"

[engine]
network_cmd_options = ["allow_host_loopback=false"]
